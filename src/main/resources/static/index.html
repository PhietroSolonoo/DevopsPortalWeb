<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏬 Catálogo de Produtos</h1>
            <p>Gerencie seu estoque com facilidade</p>
        </header>

        <!-- Formulário de cadastro/edição -->
        <div class="card">
            <h2>📦 Cadastrar / Editar Produto</h2>
            <form id="produtoForm">
                <input type="text" id="codigo" placeholder="Código (ex: P001)" required>
                <input type="text" id="nome" placeholder="Nome do produto" required>
                <input type="number" step="0.01" id="preco" placeholder="Preço (R$)" required>
                <input type="number" id="estoque" placeholder="Quantidade em estoque" required>
                <button type="submit" id="btnSalvar">Salvar</button>
                <button type="button" id="cancelarBtn">Cancelar</button>
            </form>
        </div>

        <!-- Lista de produtos -->
        <div class="card">
            <h2>📋 Lista de Produtos</h2>
            <table id="tabelaProdutos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Preço (R$)</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Formulário de entrega do desafio (webhook) -->
        <div class="card webhook-card">
            <h2>✅ Entrega do Desafio</h2>
            <p>Preencha seus dados para concluir a atividade</p>
            <form id="entregaForm">
                <input type="text" id="entregaNome" placeholder="Seu nome" required>
                <input type="text" id="entregaRm" placeholder="Seu RM" required>
                <input type="text" id="entregaTurma" placeholder="Turma" required>
                <button type="submit">Enviar conclusão</button>
            </form>
            <div id="msgEntrega"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/produtos';

        async function carregarProdutos() {
            const res = await fetch(API_BASE);
            const produtos = await res.json();
            const tbody = document.querySelector('#tabelaProdutos tbody');
            tbody.innerHTML = '';
            produtos.forEach(produto => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = produto.codigo;
                row.insertCell(1).innerText = produto.nome;
                row.insertCell(2).innerText = `R$ ${produto.preco.toFixed(2)}`;
                row.insertCell(3).innerText = produto.quantidadeEstoque;
                const actions = row.insertCell(4);
                actions.innerHTML = `
                    <button class="edit-btn" onclick="editar('${produto.codigo}', '${produto.nome}', ${produto.preco}, ${produto.quantidadeEstoque})">✏️</button>
                    <button class="delete-btn" onclick="excluir('${produto.codigo}')">🗑️</button>
                `;
            });
        }

        document.getElementById('produtoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const codigo = document.getElementById('codigo').value.trim();
            const nome = document.getElementById('nome').value.trim();
            const preco = parseFloat(document.getElementById('preco').value);
            const quantidadeEstoque = parseInt(document.getElementById('estoque').value);
            const produto = { codigo, nome, preco, quantidadeEstoque };

            let method = 'POST';
            let url = API_BASE;
            const isEditing = document.getElementById('produtoForm').hasAttribute('data-edit-mode');
            if (isEditing) {
                method = 'PUT';
                url = `${API_BASE}/${codigo}`;
            }

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(produto)
            });
            if (res.ok) {
                alert(isEditing ? 'Produto atualizado!' : 'Produto criado!');
                cancelarEdicao();
                carregarProdutos();
            } else {
                alert('Erro ao salvar produto.');
            }
        });

        function editar(codigo, nome, preco, estoque) {
            document.getElementById('codigo').value = codigo;
            document.getElementById('nome').value = nome;
            document.getElementById('preco').value = preco;
            document.getElementById('estoque').value = estoque;
            document.getElementById('produtoForm').setAttribute('data-edit-mode', 'true');
            document.getElementById('cancelarBtn').style.display = 'inline-block';
        }

        function cancelarEdicao() {
            document.getElementById('produtoForm').removeAttribute('data-edit-mode');
            document.getElementById('produtoForm').reset();
            document.getElementById('cancelarBtn').style.display = 'none';
        }

        async function excluir(codigo) {
            if (confirm(`Deseja excluir o produto ${codigo}?`)) {
                const res = await fetch(`${API_BASE}/${codigo}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Excluído!');
                    carregarProdutos();
                } else {
                    alert('Erro ao excluir.');
                }
            }
        }

        document.getElementById('cancelarBtn').addEventListener('click', cancelarEdicao);

        // Webhook (mesmo código, apenas para entrega)
        document.getElementById('entregaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('entregaNome').value.trim();
            const rm = document.getElementById('entregaRm').value.trim();
            const turma = document.getElementById('entregaTurma').value.trim();
            const payload = { nome, rm, turma };

            const res = await fetch('/entregas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const msg = await res.text();
            document.getElementById('msgEntrega').innerText = msg;
            if (res.ok) {
                document.getElementById('entregaForm').reset();
            }
        });

        // Inicializar
        carregarProdutos();
    </script>
</body>
</html>
