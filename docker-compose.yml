version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: portal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: portal_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: portal-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/portal_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      APP_WEBHOOK_URL: ${APP_WEBHOOK_URL:-https://webhook.site/xxxxxx}  # substitua pelo URL real
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data: